<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Treestore — Вход</title>
    <link rel="stylesheet" href="/static/style1.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">Treestore</div>
            <nav class="menu">
                <a href="/" class="menu-item">Главная</a>
                <a href="/catalog" class="menu-item">Каталог</a>
                <a href="/cart" class="menu-item">Корзина</a>
                <a href="/search" class="menu-item">Поиск</a>
            </nav>
        </aside>
        <main class="main">
            <div class="topbar"><h1>Вход в аккаунт</h1></div>
            <div class="about" style="max-width: 400px;">
                {% if error %}
                    <p style="color: red; margin-bottom: 15px;">{{ error }}</p>
                {% endif %}
                <form method="post" action="/login" style="display: flex; flex-direction: column; gap: 15px;">
                    <input type="email" name="email" placeholder="Email" required style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
                    <input type="password" name="password" placeholder="Пароль" required style="padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
                    <button type="submit" class="btn-buy">Войти</button>
                </form>
                <p style="margin-top: 15px; font-size: 14px;">Нет аккаунта? <a href="/register" style="color: #205935;">Зарегистрироваться</a></p>
            </div>
        </main>
    </div>
</body>
</html>
