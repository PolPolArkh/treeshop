<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Treestore{% endblock %}</title>
    <link rel="stylesheet" href="/static/style1.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <a href="/" class="logo" style="text-decoration: none;">Treestore</a>
            <nav class="menu">
                <a href="/" class="menu-item">Главная</a>
                <a href="/catalog" class="menu-item">Каталог</a>
                <a href="/cart" class="menu-item">Корзина</a>
                <a href="/search" class="menu-item">Поиск</a>
            </nav>
        </aside>

        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
